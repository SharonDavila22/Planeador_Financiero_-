version: "3.9"

services:
  db:
    image: postgres:16
    container_name: finanzas_db
    restart: always
    environment:
      POSTGRES_USER: finanzas_user
      POSTGRES_PASSWORD: finanzas_pass
      POSTGRES_DB: finanzas_db
    ports:
      - "5432:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finanzas_user -d finanzas_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: finanzas_api
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py collectstatic --noinput &&
             gunicorn finanzas.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    environment:
      DJANGO_SETTINGS_MODULE: finanzas.settings
      SECRET_KEY: change-me-in-production
      DEBUG: "False"
      DB_HOST: db
      DB_PORT: "5432"
      POSTGRES_DB: finanzas_db
      POSTGRES_USER: finanzas_user
      POSTGRES_PASSWORD: finanzas_pass
      ALLOWED_HOSTS: "localhost 127.0.0.1"
      CORS_ALLOWED_ORIGINS: "http://localhost:3000"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - .:/app
